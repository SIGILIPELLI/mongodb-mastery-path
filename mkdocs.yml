      - "05 · How Indexes Work & Compound Index Design": level-2/05-indexes-compound.md
      - "06 · Multikey, Unique, Partial, TTL, Wildcard & Text Indexes": level-2/06-index-types.md
      - "07 · Reading explain()": level-2/07-reading-explain.md
