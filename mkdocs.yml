site_name: MongoDB Mastery Path
site_description: A hands-on MongoDB course — BSON documents, CRUD, drivers, document modeling and schema patterns, indexes and explain plans, the aggregation pipeline, transactions, change streams, replica sets, sharding, security, backups and performance tuning.
site_url: https://sigilipelli.github.io/mongodb-mastery-path/
repo_url: https://github.com/sigilipelli/mongodb-mastery-path
repo_name: mongodb-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · MongoDB Foundations":
      - Overview: level-1/index.md
      - "01 · How MongoDB Is Built: mongod, Storage & a Local Lab": level-1/01-architecture-and-setup.md
      - "02 · mongosh Like a Pro": level-1/02-mongosh-like-a-pro.md
      - "03 · Documents, BSON & Data Types": level-1/03-documents-bson-types.md
      - "04 · Inserting & Querying Documents": level-1/04-insert-and-query.md
      - "05 · Querying Arrays & Embedded Documents": level-1/05-arrays-embedded-queries.md
      - "06 · Update Operators, Upserts & Array Updates": level-1/06-update-operators.md
      - "07 · Deletes, Replaces & Bulk Writes": level-1/07-deletes-replaces-bulk.md
      - "08 · Drivers: PyMongo & the Node.js Driver": level-1/08-drivers.md
      - "09 · mongoimport, mongoexport, mongodump & mongorestore": level-1/09-import-export-dump.md
      - "10 · Project — Recipe Box Data Layer": level-1/10-project-recipe-box.md
  - "Level 2 · Data Modeling & Indexes":
